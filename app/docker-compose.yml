services:
  frontend:
    build:
      context: ../frontend
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python", "api.py"]

  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app
    command: ["watchfiles", "--filter", "python", "python main.py", "/app"]
    init: true
